# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python checks

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@v2
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-suffix: "python${{ matrix.python-version }}"
    - name: Install the project
      run: uv sync --all-extras --dev
      #----------------------------------------------
      #              run ruff
      #----------------------------------------------
    - name: Linter with ruff
      if: matrix.python-version == 3.15
      run: |
        uv run ruff check .
        uv run ruff format --check .
      #----------------------------------------------
      #              run pytest
      #----------------------------------------------
    - name: Test with pytest
      run: |
        uv run pytest -n auto --cov --cov-report=xml:coverage.xml
        uv run coverage xml
      #----------------------------------------------
      #          upload coverage
      #----------------------------------------------
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.python-version == 3.15
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
        directory: .
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        flags: unittests
        name: codecov-umbrella
        verbose: true

  pssm-drift:
    # The XMI may not be stored or cached anywhere, see tests/uml/pssm/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-suffix: "pssm-drift"
    - name: Install the project
      run: uv sync --all-extras --dev
    - name: Download the PSSM test suite XMI
      run: |
        xmi_dir="$(mktemp -d)"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$xmi_dir/PSSM_TestSuite.xmi" \
          https://www.omg.org/spec/PSSM/20181101/PSSM_TestSuite.xmi
        echo "PSSM_XMI=$xmi_dir/PSSM_TestSuite.xmi" >> "$GITHUB_ENV"
    - name: Compare the committed cases with the converter output
      env:
        PSSM_REQUIRED: "1"
      run: uv run pytest tests/uml/pssm/test_pssm_drift.py --timeout 300
