on:
  push:
    tags: [ 'v?*.*.*' ]
name: release

env:
  # Must match the exclude-newer span recorded in uv.lock, or `uv sync --locked` fails.
  UV_EXCLUDE_NEWER: "7 days"

jobs:
  release-build:
    name: Build release artifacts
    runs-on: ubuntu-latest

    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Test
        run: |
          uv run pytest -n auto --cov

      - name: Build
        run: |
          uv build

      - name: Upload  dists
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/


  pypi-publish:
    # by a dedicated job to publish we avoid the risk of
    # running code with access to PyPI credentials
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-build
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
